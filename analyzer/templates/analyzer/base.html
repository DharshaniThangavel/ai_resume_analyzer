<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Resume Analyzer{% endblock %}</title>
    <!-- Tailwind CSS CDN for Modern UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

   <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="{% url 'upload_resume' %}" class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold tracking-wider shadow-sm">
                    AI
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                    ResumeAnalyzer Pro
                </span>
            </a>
            
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                <a href="{% url 'history' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors">History</a>
                <span class="text-sm font-semibold text-slate-700">Hi, {{ user.username }}</span>
                <form method="POST" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-sm font-medium text-slate-500 hover:text-red-600 transition-colors cursor-pointer">
                        Logout
                    </button>
                </form>
                {% else %}
                <a href="{% url 'login' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors">Log In</a>
                <a href="{% url 'signup' %}" class="text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl shadow-xs transition-colors">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-400">
            AI Resume Analyzer &bull; Built with Django & Sentence Transformers
        </div>
    </footer>

</body>
</html>
